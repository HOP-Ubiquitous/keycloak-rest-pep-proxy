version: '3.3'

services:
  keycloak:
    image: hopu/keycloak:23.0
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_FEATURES=scripts
    ports:
      - "8080:8080"
    configs:
      - source: keycloak-realm
        target: /opt/keycloak/data/import/realm-export.json
    command: start --spi-login-protocol-openid-connect-legacy-logout-redirect-uri=true --proxy=edge --hostname-strict=false --http-relative-path=/auth --import-realm
    networks:
      - keycloak-network

  echo:
    image: ealen/echo-server
    ports:
      - "3000:80"
    networks:
      - keycloak-network

  pep:
    image: hopu/keycloak-rest-pep:23.0
    environment:
      - SPRING_CONFIG_NAME=application
      - SPRING_CONFIG_LOCATION=/opt/
    ports:
      - "8081:8081"
    configs:
      - source: pep-conf
        target: /opt/application.properties
      - source: pep-enforcer
        target: /opt/policy-enforcer.json
    networks:
      - keycloak-network

configs:
  pep-conf:
    file: ./application.properties
  pep-enforcer:
    file: ./policy-enforcer.json
  keycloak-realm:
    file: ./fiware-realm.json

networks:
  keycloak-network: